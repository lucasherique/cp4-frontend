<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Importação da Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    
    <main>

                <img src="images/banner/03.jpg" alt="Igreja de arquitetura grega tradicional com cúpula azul à beira-mar">
